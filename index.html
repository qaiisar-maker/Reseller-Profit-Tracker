:root{
  --bg:#F7F6F2;--bg2:#EEECE6;--card:#FFFFFF;--ink:#1F2733;--muted:#5F6773;--faint:#9AA0A8;--line:#E3E1DA;
  --primary:#26395A;--primary-h:#1C2C47;--on-primary:#FFFFFF;--primary-soft:#E2E7F0;--primary-ink:#26395A;
  --accent:#C9962E;--accent-soft:#F3E3B5;--accent-ink:#7A5A14;
  --gold:#C9962E;--gold-soft:#F6EBCF;--gold-ink:#7A5A14;--rose:#C2574F;--rose-soft:#F6E0DD;--rose-ink:#9A3B34;--slate:#8A95AA;
  --ok:#2F7A55;--ok-soft:#DCEFE4;--ok-ink:#25643F;
  --hero:linear-gradient(135deg,#E2E7F0 0%,#F6EFDD 100%);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;--fs:16px;--shadow:0 1px 2px rgba(30,40,60,.05),0 6px 20px rgba(30,40,60,.05);
}
[data-theme="teal"]{--bg:#F5F7F6;--bg2:#E9EEEC;--line:#DDE4E1;--ink:#1D2A29;--primary:#1F6F6B;--primary-h:#185956;--primary-soft:#D9ECE9;--primary-ink:#1A5E5A;--accent:#D08A3C;--accent-soft:#F6E3CC;--accent-ink:#7E4E17;--hero:linear-gradient(135deg,#D9ECE9 0%,#F5EEE2 100%)}
[data-theme="forest"]{--bg:#F6F7F2;--bg2:#ECEFE6;--line:#DFE4D8;--ink:#232C24;--primary:#3B5B3F;--primary-h:#2F4A33;--primary-soft:#E1EADB;--primary-ink:#34523A;--accent:#B98A3A;--accent-soft:#F1E5CC;--accent-ink:#755418;--hero:linear-gradient(135deg,#E1EADB 0%,#F4EEE0 100%)}
[data-theme="plum"]{--bg:#FAF6F8;--bg2:#F0E8EC;--line:#E8DDE3;--ink:#2C2229;--primary:#6B3E5E;--primary-h:#58324D;--primary-soft:#EEDFE8;--primary-ink:#5E3553;--accent:#B98A3A;--accent-soft:#F1E5CC;--accent-ink:#755418;--hero:linear-gradient(135deg,#EEDFE8 0%,#F6EEE4 100%)}
[data-theme="terracotta"]{--bg:#FBF6F2;--bg2:#F3EAE3;--line:#EADDD3;--ink:#33251F;--primary:#A8553A;--primary-h:#8E452E;--primary-soft:#F5E0D5;--primary-ink:#8E452E;--accent:#3F6B6A;--accent-soft:#DCEAE8;--accent-ink:#2E5655;--hero:linear-gradient(135deg,#F5E0D5 0%,#F6EFDF 100%)}
[data-theme="slate"]{--bg:#F6F7F8;--bg2:#EBEDF0;--line:#DFE3E7;--ink:#20262D;--primary:#4A5563;--primary-h:#3C4551;--primary-soft:#E3E7EC;--primary-ink:#3E4855;--accent:#C9962E;--accent-soft:#F3E3B5;--accent-ink:#7A5A14;--hero:linear-gradient(135deg,#E3E7EC 0%,#F4F0E6 100%)}
[data-theme="night"]{color-scheme:dark;--bg:#1D2028;--bg2:#282C36;--card:#262A33;--ink:#ECEAE4;--muted:#B3B0A8;--faint:#858279;--line:#383D48;
  --primary:#E0B85C;--primary-h:#ECC873;--on-primary:#1D2028;--primary-soft:#3D3624;--primary-ink:#F1D79C;
  --accent:#7FA7D9;--accent-soft:#2D3A4E;--accent-ink:#BFD5F2;--gold:#E0B85C;--gold-soft:#433822;--gold-ink:#E7C88E;--rose:#D9827B;--rose-soft:#4A3130;--rose-ink:#F0C2BE;
  --ok:#6FC195;--ok-soft:#24392E;--ok-ink:#A7E0C0;
  --hero:linear-gradient(135deg,#2B303C 0%,#3A3426 100%);--shadow:0 1px 2px rgba(0,0,0,.3)}
[data-size="s"]{--fs:15px}[data-size="l"]{--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif,.tile .v,.stat .v{font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:2.1rem;line-height:1.1}h2{font-size:1.55rem;line-height:1.15}h3{font-size:1.2rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.15rem;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:.62rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tab:hover{background:var(--bg2)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.botnav{display:none}
main{max-width:1040px;margin:0 auto;padding:22px 18px 110px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.tile .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols>*{margin-top:0!important}
.scale button b svg{width:1.4em;height:1.4em}
.stat .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:2px}
.stat .s{font-size:.75rem;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn.danger{color:#B3473F}
.btn svg,.ico{width:16px;height:16px;flex:none}
.link{background:none;border:0;padding:0;color:var(--primary-ink);cursor:pointer;font-size:.85rem;font-weight:500}
[data-theme="night"] .link{color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;background:var(--primary-soft);color:var(--primary-ink)}
.pill.lav{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:#7A5A1E}[data-theme="night"] .pill.gold{color:var(--gold)}
.pill.rose{background:var(--rose-soft);color:var(--rose-ink)}
/* chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.84rem}

/* ---------- utilities ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkey(new Date());
const addDays = (k, n) => { const d = pkey(k); d.setDate(d.getDate()+n); return dkey(d); };
const diffDays = (a, b) => Math.round((pkey(b) - pkey(a)) / 864e5);
const rangeKeys = (n, end=todayKey()) => { const a=[]; for (let i=n-1;i>=0;i--) a.push(addDays(end,-i)); return a; };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDF = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtShort = k => { const d = pkey(k); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = k => { const d = pkey(k); return `${WDF[d.getDay()]}, ${MONF[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtMid = k => { const d = pkey(k); return `${WD[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = ts => { const d = new Date(ts); let h = d.getHours(), m = d.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${pad(m)} ${ap}`; };
const hourLabel = h => `${h%12||12} ${h>=12?'PM':'AM'}`;
const fmtHM = hrs => { if (hrs==null || isNaN(hrs)) return '—'; const h = Math.floor(hrs), m = Math.round((hrs-h)*60); return m===60 ? `${h+1}h` : `${h}h${m?` ${pad(m)}m`:''}`; };
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const r1 = x => x==null ? '—' : (Math.round(x*10)/10).toString();
const plural = (n, w, p) => `${n} ${n===1?w:(p||w+'s')}`;

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = v => Math.round(v*100)/100;
function money(v, whole){
  const n = round2(num(v)), c = DB.settings.currency || '$';
  const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: whole?0:2, maximumFractionDigits: whole?0:2});
  return (n<0?'−':'') + (/^[A-Za-z]/.test(c) ? c+' ' : c) + s;
}
const pct = (v, d=1) => v==null || !isFinite(v) ? '—' : (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d) + '%';

/* ---------- small ui helpers ---------- */
let toastT;
function toast(msg, undo){
  $$('.toast').forEach(t=>t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
  document.body.appendChild(t);
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  toastT = setTimeout(()=>t.remove(), 4200);
}
function modal(title, body, foot, opts={}){
  closeModal();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2 style="font-size:1.4rem">${title}</h2><button class="x" aria-label="Close">${ic('x')}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target===ov && !opts.sticky) closeModal(); });
  $('.x', ov).onclick = closeModal;
  document.body.style.overflow='hidden';
  return ov;
}
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); document.body.style.overflow=''; } }
function confirmBox(msg, yes, label='Delete'){
  const ov = modal('Are you sure?', `<p class="muted" style="margin-top:12px">${msg}</p>`, `<button class="btn" data-c>Cancel</button><button class="btn pri" data-y>${label}</button>`);
  $('[data-c]',ov).onclick = closeModal; $('[data-y]',ov).onclick = () => { closeModal(); yes(); };
}
function download(name, text, type='text/plain'){
  const b = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- charts (pure SVG, offline) ---------- */
function barChart(vals, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||150, pl=24, pb=20, pt=8, n=vals.length, max=Math.max(o.max||0, ...vals, 1);
  const bw=(W-pl)/n, gap=Math.min(6, bw*.3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g=0; g<=2; g++){ const y=pt+(H-pt-pb)*(1-g/2); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${g?'3 4':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${r1(max*g/2).replace(/\.0$/,'')}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-pt-pb)*(v/max), x=pl+i*bw+gap/2, y=H-pb-h;
    if (v>0) s+=`<rect x="${x}" y="${y}" width="${Math.max(bw-gap,1.5)}" height="${h}" rx="${Math.min(3,(bw-gap)/2)}" fill="${o.color||'var(--gold)'}"><title>${esc(labels[i]||'')}: ${r1(v)}</title></rect>`;
    const every = o.every || Math.ceil(n/8);
    if (labels[i] && i%every===0) s+=`<text x="${x+(bw-gap)/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function lineChart(series, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||160, pl=24, pb=20, pt=10, n=labels.length, min=o.min??0, max=o.max??Math.max(...series.flatMap(s=>s.vals.filter(v=>v!=null)),1);
  const X=i=>pl+(n<=1?0:(W-pl-8)*i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = o.ticks || [min,(min+max)/2,max];
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${o.fmt?o.fmt(t):r1(t).replace(/\.0$/,'')}</text>`; });
  const every = o.every || Math.ceil(n/7);
  labels.forEach((l,i)=>{ if(i%every===0) s+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se=>{
    let d='', area='', started=false, lastX=0, firstX=0;
    se.vals.forEach((v,i)=>{ if(v==null) return; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; if(!started) firstX=X(i); started=true; lastX=X(i); });
    if (!started) return;
    if (se.fill) s+=`<path d="${d}L${lastX} ${H-pb} L${firstX} ${H-pb} Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="var(--card)" stroke="${se.color}" stroke-width="1.6"><title>${esc(labels[i])}: ${o.fmt?o.fmt(v):r1(v)}</title></circle>`; });
  });
  return s+'</svg>';
}

/* ---------- photo storage (IndexedDB, stays on device) ---------- */
const PH = {cache:{}, db:null};
function phDB(){ return PH.db || (PH.db = new Promise((res,rej)=>{ try { const r=indexedDB.open(APP.photoDB,1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); } catch(e){ rej(e); } })); }
async function phPut(id, data){ const db=await phDB(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>{PH.cache[id]=data;res();}; t.onerror=()=>rej(t.error); }); }
async function phGet(id){ if (PH.cache[id]) return PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ PH.cache[id]=r.result; res(r.result); }; r.onerror=()=>res(null); }); }
async function phDel(id){ delete PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').delete(id); t.oncomplete=res; t.onerror=res; }); }
async function phAll(){ const db=await phDB(); return new Promise(res=>{ const out={}; const r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
function shrink(file, max=1400){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function pickPhoto(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=async()=>{ if(!i.files[0]) return res(null); try{ res(await shrink(i.files[0])); }catch(e){ toast("That image couldn't be opened."); res(null);} }; i.click(); }); }

function feeFor(pid, price, shipCharged){ const p=P(pid); if(!p) return 0; const base=num(price)+(p.ship?num(shipCharged):0); return base>0 ? round2(base*num(p.pct)/100 + num(p.fixed)) : 0; }
function fixItem(it){
  const b={id:uid(), sku:'', name:'', cat:'', brand:'', source:'', bought:'', cost:0, lot:'', bin:'', price:0, where:[], status:'To list', listed:'', refresh:'', photo:'', note:'', sale:null, past:[], delist:[], tracking:''};
  Object.keys(b).forEach(k=>{ if (it[k]==null) it[k]=b[k]; }); if(!Array.isArray(it.where)) it.where=[]; if(!Array.isArray(it.past)) it.past=[]; if(!Array.isArray(it.delist)) it.delist=[];

const isSold = it => it.status==='Sold' || it.status==='Shipped';
const unsold = () => DB.items.filter(it=>!isSold(it));
/* one row per sale: the current sale carries the item cost, a returned sale (in past) does not */
function saleCalc(it, s, final){
  const revenue = round2(num(s.price)+num(s.shipCharged)), fees=round2(num(s.fees)), ship=round2(num(s.shipCost)), refund=round2(num(s.refund)), other=round2(num(s.other)), cogs=final?round2(num(it.cost)):0;
  const net = round2(revenue-fees-ship-refund-other-cogs);
  const start = it.listed || it.bought || '';
  const days = s.date && start ? Math.max(0, diffDays(start, s.date)) : null;
  return {it, s, final, date:s.date, platform:s.platform, revenue, fees, ship, refund, other, cogs, net,
          margin: revenue>0 ? net/revenue*100 : null, roi: final && cogs>0 ? net/cogs*100 : null, days, returned:!!s.returned};
}
function allSales(){ const out=[]; DB.items.forEach(it=>{ it.past.forEach(s=>out.push(saleCalc(it,s,false))); if (isSold(it) && it.sale) out.push(saleCalc(it,it.sale,true)); }); return out.sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function periodRange(k, ref=todayKey()){
  const y=+ref.slice(0,4), m=+ref.slice(5,7);
  const last = (yy,mm) => dkey(new Date(yy, mm, 0));
  if (k==='month') return [`${y}-${pad(m)}-01`, last(y,m)];
  if (k==='lmonth'){ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [`${yy}-${pad(mm)}-01`, last(yy,mm)]; }
  if (k==='year') return [`${y}-01-01`, `${y}-12-31`];
  if (k==='lyear') return [`${y-1}-01-01`, `${y-1}-12-31`];
  return ['0000-01-01','9999-12-31'];
}
const inRange = (d, r) => d && d>=r[0] && d<=r[1];
const salesIn = r => allSales().filter(x=>inRange(x.date, r));
function totals(rows){
  const t={count:0, sold:0, returned:0, revenue:0, fees:0, ship:0, refund:0, other:0, cogs:0, net:0, days:[]};
  rows.forEach(x=>{ t.count++; if (x.final) t.sold++; if (x.returned || x.refund>0) t.returned++; ['revenue','fees','ship','refund','other','cogs','net'].forEach(k=>t[k]+=x[k]); if (x.final && x.days!=null) t.days.push(x.days); });
  ['revenue','fees','ship','refund','other','cogs','net'].forEach(k=>t[k]=round2(t[k]));
  t.avgProfit = t.sold ? round2(t.net/t.sold) : 0; t.avgSale = t.sold ? round2(rows.filter(x=>x.final).reduce((s,x)=>s+x.revenue,0)/t.sold) : 0;
  t.margin = t.revenue>0 ? t.net/t.revenue*100 : null; t.roi = t.cogs>0 ? t.net/t.cogs*100 : null; t.avgDays = t.days.length ? Math.round(avg(t.days)) : null;
  return t;
}
const expIn = r => DB.expenses.filter(e=>inRange(e.date, r));
const tripsIn = r => DB.trips.filter(t=>inRange(t.date, r));
const tripDist = t => round2(num(t.miles)*(t.round?2:1));
function pnl(r){
  const t=totals(salesIn(r)), exp=round2(expIn(r).reduce((s,e)=>s+num(e.amount),0)), dist=round2(tripsIn(r).reduce((s,x)=>s+tripDist(x),0));
  return {...t, exp, profit:round2(t.net-exp), dist, mileVal:round2(dist*num(DB.settings.rate)), tax:round2(Math.max(0, t.net-exp)*num(DB.settings.tax)/100)};
}
function invStats(){
  const U=unsold(); const today=todayKey();
  const age = it => diffDays(it.bought || it.listed || today, today);
  const b=[0,0,0,0]; U.forEach(it=>{ const a=age(it); b[a<=30?0:a<=60?1:a<=90?2:3]++; });
  return {count:U.length, toList:U.filter(i=>i.status==='To list').length, listed:U.filter(i=>i.status==='Listed').length, cost:round2(U.reduce((s,i)=>s+num(i.cost),0)), value:round2(U.reduce((s,i)=>s+num(i.price),0)), aging:b,
          toShip:DB.items.filter(i=>i.status==='Sold').length, stale:staleItems().length, delist:DB.items.filter(i=>i.delist.length).length};
}
function staleItems(){ const n=num(DB.settings.stale)||60, t=todayKey(); return DB.items.filter(i=>i.status==='Listed' && (i.refresh||i.listed) && diffDays(i.refresh||i.listed, t)>=n).sort((a,b)=>(a.refresh||a.listed).localeCompare(b.refresh||b.listed)); }
function nextSku(){ const s=DB.settings; let n=num(s.skuNext)||1, sku; const have=new Set(DB.items.map(i=>i.sku)); do { sku=(s.prefix||'')+String(n).padStart(4,'0'); n++; } while(have.has(sku)); s.skuNext=n; return sku; }
/* buy or pass: what a find would earn */
function buyCalc(cost, sell, pid, ship, target){
  const fees=feeFor(pid, sell, 0), net=round2(num(sell)-fees-num(ship)-num(cost));
  const max=round2(num(sell)-fees-num(ship)-num(target));
  return {fees, net, roi:num(cost)>0?net/num(cost)*100:null, margin:num(sell)>0?net/num(sell)*100:null, max,
          verdict: num(sell)<=0 ? '' : net>=num(target) ? 'buy' : net>0 ? 'think' : 'pass'};
}
/* split a lot's total across its items: equally, or in proportion to list price; cents always add up */
function splitLot(lot, how){
  const its=DB.items.filter(i=>i.lot===lot.id); if(!its.length) return 0;
  const total=Math.round(num(lot.total)*100); let w=its.map(i=>how==='price'?Math.max(num(i.price),0):1); if(!w.some(x=>x>0)) w=its.map(()=>1); const W=w.reduce((a,b)=>a+b,0);
  let used=0; its.forEach((it,i)=>{ const c = i===its.length-1 ? total-used : Math.floor(total*w[i]/W); it.cost=c/100; used+=c; });
  return its.length;
}

/* revenue + net profit by month; profit can go below zero */
function monthChart(rows){
  const W=innerWidth<760?380:640, H=170, pl=40, pb=20, pt=10;
  const hi=Math.max(1, ...rows.map(r=>Math.max(r.rev, r.net))), lo=Math.min(0, ...rows.map(r=>r.net));
  const Y=v=>pt+(H-pt-pb)*(hi-v)/(hi-lo||1), bw=(W-pl)/rows.length, b=Math.min(14,(bw-6)/2);
  let s=`<svg class="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and net profit by month">`;
  [hi, hi/2, 0, lo].filter((v,i,a)=>a.indexOf(v)===i && (v!==lo || lo<0)).forEach(v=>{ s+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="3 4"'}/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${money(v,true)}</text>`; });
  rows.forEach((r,i)=>{ const x=pl+i*bw+bw/2;
    if (r.rev>0) s+=`<rect x="${x-b-1}" y="${Y(r.rev)}" width="${b}" height="${Y(0)-Y(r.rev)}" rx="2" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width=".6"><title>${esc(r.label)} revenue: ${money(r.rev)}</title></rect>`;
    if (r.net) s+=`<rect x="${x+1}" y="${Math.min(Y(r.net),Y(0))}" width="${b}" height="${Math.abs(Y(0)-Y(r.net))}" rx="2" fill="${r.net<0?'var(--rose)':'var(--accent)'}"><title>${esc(r.label)} net profit: ${money(r.net)}</title></rect>`;
    s+=`<text x="${x}" y="${H-5}" text-anchor="middle">${esc(r.label)}</text>`; });
  return s+`</svg><div class="legend"><span><i style="background:var(--primary-soft);border:1px solid var(--primary)"></i>Revenue</span><span><i style="background:var(--accent)"></i>Net profit</span></div>`;
}

/* ---------- inventory ---------- */
const ISEG = [['active','In stock'],['tolist','To list'],['listed','Listed'],['slow','Slow'],['ship','To ship'],['sold','Sold'],['all','All']];
function itemFilter(){
  const k=S.iseg, slow=new Set(staleItems().map(i=>i.id)), q=S.iq.trim().toLowerCase();
  return DB.items.filter(it=>{
    if (k==='active' && isSold(it)) return false;
    if (k==='tolist' && it.status!=='To list') return false;
    if (k==='listed' && it.status!=='Listed') return false;
    if (k==='slow' && !slow.has(it.id)) return false;
    if (k==='ship' && it.status!=='Sold') return false;
    if (k==='sold' && !isSold(it)) return false;
    if (S.ip && !(it.where.includes(S.ip) || it.sale?.platform===S.ip)) return false;
    if (S.ic && it.cat!==S.ic) return false;
    if (q && ![it.name,it.sku,it.brand,it.bin,it.note,it.source,it.cat].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> isSold(a)&&isSold(b) ? (b.sale?.date||'').localeCompare(a.sale?.date||'') : (b.bought||b.listed||'').localeCompare(a.bought||a.listed||''));
}
const ageOf = it => isSold(it) ? (it.sale && (it.listed||it.bought) ? Math.max(0,diffDays(it.listed||it.bought, it.sale.date)) : null) : (it.bought||it.listed) ? diffDays(it.bought||it.listed, todayKey()) : null;
const itemNet = it => isSold(it) && it.sale ? saleCalc(it, it.sale, true).net : null;
function vItems(){
  const L=itemFilter(), cats=[...new Set([...CATS.filter(c=>DB.items.some(i=>i.cat===c)), ...DB.items.map(i=>i.cat).filter(Boolean)])];
  const cost=round2(L.reduce((s,i)=>s+num(i.cost),0)), val=round2(L.filter(i=>!isSold(i)).reduce((s,i)=>s+num(i.price),0)), net=round2(L.reduce((s,i)=>s+(itemNet(i)||0),0)), anySold=L.some(isSold);
  const counts = Object.fromEntries(ISEG.map(([k])=>{ const o=S.iseg; S.iseg=k; const ps=S.ip, cs=S.ic, qs=S.iq; S.ip=''; S.ic=''; S.iq=''; const n=itemFilter().length; S.iseg=o; S.ip=ps; S.ic=cs; S.iq=qs; return [k,n]; }));
  return `<div class="between"><div><h1>Inventory</h1><p class="muted">Every item from sourcing to sold.</p></div>
    <div class="row"><button class="btn" data-act="itemBulk">${ic('list')} Add several</button><button class="btn pri" data-act="itemNew">${ic('plus')} Add item</button></div></div>
   <div style="margin-top:14px">${seg('iseg', ISEG.map(([k,l])=>[k, `${l} <span class="faint">${counts[k]}</span>`]), S.iseg)}</div>
   <div class="row" style="margin-top:12px;flex-wrap:nowrap">
    <div style="position:relative;flex:1;min-width:0"><input type="search" id="iq" placeholder="Search items…" value="${esc(S.iq)}" aria-label="Search items"></div>
    <select id="ip" style="width:auto;max-width:38%" aria-label="Platform"><option value="">All platforms</option>${DB.platforms.map(p=>`<option value="${p.id}" ${S.ip===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <select id="icat" class="hide-m" style="width:auto" aria-label="Category"><option value="">All categories</option>${cats.map(c=>`<option ${S.ic===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div class="grid g3 keep" style="margin-top:12px">
    <div class="tile"><div class="l">Items</div><div class="v">${L.length}</div></div>
    <div class="tile"><div class="l">Cost</div><div class="v">${money(cost)}</div></div>
    <div class="tile"><div class="l">${anySold&&!val?'Net profit':'Listed value'}</div><div class="v ${anySold&&!val?sgn(net):''}">${anySold&&!val?money(net):money(val)}</div></div></div>
   <div class="card" style="margin-top:12px;padding:10px 12px">
    ${L.length?`<div class="hide-m tblw"><table class="tbl t-sm"><thead><tr><th></th><th>Item</th><th>Status</th><th>Platform</th><th class="num-r">Cost</th><th class="num-r">${S.iseg==='sold'||S.iseg==='ship'?'Sold for':'Price'}</th><th class="num-r">Profit</th><th class="num-r">Days</th></tr></thead><tbody>
     ${L.map(it=>{ const n=itemNet(it), a=ageOf(it); return `<tr class="clk" data-act="itemOpen" data-arg="${it.id}"><td style="width:52px">${thumb(it)}</td><td><b style="font-weight:500">${esc(it.name)}</b><div class="tiny faint">${esc(it.sku)}${it.bin?' · bin '+esc(it.bin):''}${it.delist.length?' · <span style="color:var(--rose-ink)">delist</span>':''}</div></td><td>${stPill(it.status)}</td>
      <td>${it.sale?plat(it.sale.platform):it.where.length?it.where.slice(0,2).map(plat).join('<br>')+(it.where.length>2?` <span class="tiny faint">+${it.where.length-2}</span>`:''):'<span class="faint">—</span>'}</td>
      <td class="num-r">${money(it.cost)}</td><td class="num-r">${money(it.sale?num(it.sale.price):it.price)}</td><td class="num-r ${sgn(n)}">${n==null?'<span class="faint">—</span>':money(n)}</td><td class="num-r">${a==null?'—':a}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="hide-d">${L.map(it=>{ const n=itemNet(it); return `<div class="irow" data-act="itemOpen" data-arg="${it.id}">${thumb(it)}<div class="grow"><div class="nm">${esc(it.name)}</div><div class="mt">${esc(it.sku)}${it.bin?' · '+esc(it.bin):''} · ${it.sale?esc(pName(it.sale.platform)):it.where.length?it.where.map(x=>esc(pName(x))).join(', '):'not listed'}</div><div style="margin-top:3px">${stPill(it.status)}${it.delist.length?' <span class="pill rose">delist</span>':''}</div></div><div class="rt">${n!=null?`<b class="${sgn(n)}">${money(n)}</b><span class="tiny faint">profit</span>`:`<b>${money(it.price)}</b><span class="tiny faint">cost ${money(it.cost)}</span>`}</div></div>`; }).join('')}</div>`
    :`<div class="empty">${DB.items.length?'No items match.':'No items yet. Add what you have bought — or try the sample data in Settings.'}</div>`}
   </div>
   <div class="row" style="margin-top:12px"><button class="btn sm" data-act="csvInv">${ic('down')} Export inventory CSV</button><button class="btn sm" data-act="printInv">${ic('print')} Print</button></div>`;
}

    <div class="calcbox">${facts.map(([l,v])=>`<div><div class="l">${l}</div><div class="v" style="font-family:var(--sans);font-size:.92rem;overflow:hidden;text-overflow:ellipsis">${v}</div></div>`).join('')}</div>
    ${it.past.length?`<div class="sec"><h4>Earlier sales (returned)</h4>${it.past.map(s=>{ const x=saleCalc(it,s,false); return `<p class="small muted">${fmtShort(s.date)} · ${esc(pName(s.platform))} · ${money(x.revenue)} − refund ${money(x.refund)} − costs → <span class="${sgn(x.net)}">${money(x.net)}</span></p>`; }).join('')}</div>`:''}
    ${it.note?`<div class="note" style="margin-top:12px;white-space:pre-wrap">${esc(it.note)}</div>`:''}
    <div class="row" style="margin-top:16px">${act}</div>`,
    `<button class="btn danger ghost" data-a="del" style="margin-right:auto">${ic('trash')}</button><button class="btn" data-a="dup">${ic('copy')} Duplicate</button>${isSold(it)?`<button class="btn" data-a="sale">Edit sale</button>`:''}<button class="btn" data-a="edit">${ic('edit')} Edit</button>`);

ACT.delistDone = id => { const it=DB.items.find(x=>x.id===id); if(!it) return; const old=it.delist; it.delist=[]; save(); render(); toast('Listing removed ✓', ()=>{ it.delist=old; save(); render(); }); };

const pchips = (sel, id) => `<div class="pchips" id="${id}">${DB.platforms.filter(p=>p.on!==false||sel.includes(p.id)).map(p=>`<button type="button" class="pchip ${sel.includes(p.id)?'on':''}" data-p="${p.id}"><i style="background:${p.color}"></i>${esc(p.name)}</button>`).join('')}</div>`;
const chipVals = (ov, id) => $$(`#${id} .pchip.on`, ov).map(b=>b.dataset.p);
function chipToggle(ov, id, single){ $(`#${id}`,ov).onclick = e => { const b=e.target.closest('.pchip'); if(!b) return; e.preventDefault(); if (single) $$(`#${id} .pchip`,ov).forEach(x=>x.classList.toggle('on', x===b)); else b.classList.toggle('on'); $(`#${id}`,ov).dispatchEvent(new Event('change')); }; }

ACT.listIt = id => {
  const it=DB.items.find(x=>x.id===id); if(!it) return;
  const ov = modal('Mark as listed', `<div class="sec"><label class="f">Where is it listed? <span class="faint">(cross-listed? tap them all)</span></label>${pchips(it.where,'li-w')}</div>
    <div class="grid g2 sec"><div><label class="f">List price</label><input type="number" inputmode="decimal" id="li-p" min="0" step="0.01" value="${it.price||''}"></div><div><label class="f">Date listed</label><input type="date" id="li-d" value="${todayKey()}"></div></div>`,
    `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  chipToggle(ov,'li-w'); $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { const w=chipVals(ov,'li-w'); if(!w.length){ toast('Pick at least one platform'); return; } if (num($('#li-p',ov).value)<0) return toast('Price can’t be negative');
    Object.assign(it,{where:w, price:round2(num($('#li-p',ov).value)), listed:$('#li-d',ov).value||todayKey(), refresh:'', status:'Listed'}); save(); closeModal(); render(); toast('Listed on '+w.map(pName).join(', ')); };
};
ACT.relist = id => {
  const it=DB.items.find(x=>x.id===id); if(!it) return;
  const ov = modal('Price drop / relist', `<p class="muted small" style="margin-top:12px">Resets the slow-mover timer. “Days to sell” still counts from the first listing (${it.listed?fmtShort(it.listed):'—'}).</p><div class="sec"><label class="f">New price</label><input type="number" inputmode="decimal" id="rl-p" min="0" step="0.01" value="${it.price||''}"></div>`, `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { const v=num($('#rl-p',ov).value); if (v<0) return toast('Price can’t be negative'); const old=num(it.price); it.price=round2(v); it.refresh=todayKey(); save(); closeModal(); render(); toast(v<old?`Price dropped to ${money(v)}`:'Relisted'); };
};
ACT.salePick = () => {
  const L=unsold();
  if (!L.length){ toast('Add an item first'); return ACT.itemNew(); }
  const ov = modal('Which item sold?', `<div class="sec"><input type="search" id="sp-q" placeholder="Search name, SKU or bin"></div><div id="sp-l" style="margin-top:8px"></div>`);
  const draw = () => { const q=$('#sp-q',ov).value.toLowerCase(); $('#sp-l',ov).innerHTML = L.filter(it=>[it.name,it.sku,it.bin,it.brand].join(' ').toLowerCase().includes(q)).slice(0,40).map(it=>`<div class="irow" data-pick="${it.id}">${thumb(it)}<div class="grow"><div class="nm">${esc(it.name)}</div><div class="mt">${esc(it.sku)}${it.bin?' · '+esc(it.bin):''} · ${it.status}</div></div><div class="rt"><b>${money(it.price)}</b></div></div>`).join('')||'<p class="empty">No match</p>'; afterRender(); };
  draw(); $('#sp-q',ov).oninput=draw; setTimeout(()=>$('#sp-q',ov)?.focus(),50);
  $('#sp-l',ov).onclick = e => { const r=e.target.closest('[data-pick]'); if (r) ACT.saleEdit(r.dataset.pick); };
};
ACT.saleEdit = id => {
  const it=DB.items.find(x=>x.id===id); if(!it) return;
  const s = it.sale || {date:todayKey(), platform:it.where[0]||DB.platforms[0]?.id||'', price:it.price||'', shipCharged:'', fees:'', shipCost:'', other:'', refund:0};
  let feeTouched = !!it.sale;
  const v = x => x===''||x==null ? '' : x;
  const ov = modal(it.sale?'Edit sale':'Record sale', `<p class="muted small" style="margin-top:10px">${esc(it.name)} · cost ${money(it.cost)}</p>
    <div class="sec"><label class="f">Sold on</label>${pchips([s.platform],'se-p')}</div>
    <div class="grid g2 sec"><div><label class="f">Sale date</label><input type="date" id="se-d" value="${s.date}"></div><div><label class="f">Sold price *</label><input type="number" inputmode="decimal" id="se-pr" min="0" step="0.01" value="${v(s.price)}"></div></div>
    <div class="grid g2 sec"><div><label class="f">Shipping the buyer paid</label><input type="number" inputmode="decimal" id="se-sc" min="0" step="0.01" value="${v(s.shipCharged)}" placeholder="0.00"></div><div><label class="f">Shipping you paid (label)</label><input type="number" inputmode="decimal" id="se-sp" min="0" step="0.01" value="${v(s.shipCost)}" placeholder="0.00"></div></div>
    <div class="grid g2 sec"><div><label class="f">Platform fees <button class="link tiny" id="se-auto" type="button">auto</button></label><input type="number" inputmode="decimal" id="se-f" min="0" step="0.01" value="${v(s.fees)}"></div><div><label class="f">Other costs <span class="faint">(promoted, extras)</span></label><input type="number" inputmode="decimal" id="se-o" min="0" step="0.01" value="${v(s.other)}" placeholder="0.00"></div></div>
    <p class="tiny faint" id="se-fh" style="margin-top:6px"></p>
    ${it.sale?'':`<label class="row small" style="margin-top:12px"><input type="checkbox" class="chk" id="se-sh"> Already shipped or handed over (local pickup)</label>`}
    <div class="calcbox" id="se-r"></div>`,
    `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>${it.sale?'Save':'Record sale'}</button>`);
  chipToggle(ov,'se-p',true);
  const g = k => num($('#'+k,ov).value);
  const calc = () => {
    const pid=chipVals(ov,'se-p')[0], p=P(pid);
    if (!feeTouched){ const f=feeFor(pid, g('se-pr'), g('se-sc')); $('#se-f',ov).value = g('se-pr')>0 ? f.toFixed(2) : ''; }
    $('#se-fh',ov).textContent = p ? `${p.name}: ${num(p.pct)}%${num(p.fixed)?` + ${money(p.fixed)}`:''}${p.ship?' on price + shipping':' on price'} — change in More › Platforms & fees.` : '';
    const x=saleCalc(it, {price:g('se-pr'), shipCharged:g('se-sc'), fees:g('se-f'), shipCost:g('se-sp'), other:g('se-o'), refund:num(s.refund), date:$('#se-d',ov).value}, true);
    $('#se-r',ov).innerHTML = [['Revenue',money(x.revenue)],['Fees',money(x.fees)],['Cost',money(x.cogs)],['Net profit',`<span class="${sgn(x.net)}">${money(x.net)}</span>`],['Margin',pct(x.margin,0)],['ROI',pct(x.roi,0)]].map(([l,v])=>`<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  };
  ['se-pr','se-sc','se-sp','se-o','se-f','se-d'].forEach(k=>$('#'+k,ov).oninput = () => { if (k==='se-f') feeTouched=true; calc(); });
  $('#se-p',ov).addEventListener('change', ()=>{ feeTouched=false; calc(); });
  $('#se-auto',ov).onclick = e => { e.preventDefault(); feeTouched=false; calc(); };
  calc(); $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => {
    const pid=chipVals(ov,'se-p')[0]; if(!pid) return toast('Pick where it sold');
    if (!(g('se-pr')>0)) { toast('Enter the sold price'); return $('#se-pr',ov).focus(); }
    if (['se-sc','se-sp','se-o','se-f'].some(k=>g(k)<0)) return toast('Amounts can’t be negative');
    const first=!it.sale;
    it.sale = {date:$('#se-d',ov).value||todayKey(), platform:pid, price:round2(g('se-pr')), shipCharged:round2(g('se-sc')), fees:round2(g('se-f')), shipCost:round2(g('se-sp')), other:round2(g('se-o')), refund:num(s.refund)};
    if (first){ it.status = $('#se-sh',ov)?.checked ? 'Shipped' : 'Sold'; it.delist = it.where.filter(w=>w!==pid); if(!it.listed) it.listed=''; }
    save(); closeModal(); render();
    const n=saleCalc(it,it.sale,true).net; toast(first?`Sold! ${money(n)} profit${it.delist.length?' · remove the other listings':''}`:'Sale updated');
  };
};
ACT.shipIt = id => {
  const it=DB.items.find(x=>x.id===id); if(!it) return;
  const ov = modal('Mark shipped', `<p class="muted small" style="margin-top:10px">${esc(it.name)}</p><div class="sec"><label class="f">Tracking number <span class="faint">(optional)</span></label><input type="text" id="sh-t" value="${esc(it.tracking)}"></div>`, `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Shipped</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { it.tracking=$('#sh-t',ov).value.trim(); it.status='Shipped'; save(); closeModal(); render(); toast('Shipped ✓', ()=>{ it.status='Sold'; save(); render(); }); };
};
ACT.returnIt = id => {
  const it=DB.items.find(x=>x.id===id); if(!it||!it.sale) return; const s=it.sale;
  const ov = modal('Return / refund', `<p class="muted small" style="margin-top:10px">${esc(it.name)} · sold for ${money(num(s.price)+num(s.shipCharged))}</p>
    <div class="grid g2 sec"><div><label class="f">Refund you gave</label><input type="number" inputmode="decimal" id="rt-r" min="0" step="0.01" value="${(num(s.price)+num(s.shipCharged)).toFixed(2)}"></div><div><label class="f">Return shipping you paid</label><input type="number" inputmode="decimal" id="rt-s" min="0" step="0.01" placeholder="0.00"></div></div>
    <label class="row small" style="margin-top:12px"><input type="checkbox" class="chk" id="rt-b" checked> The item came back — put it back in stock</label>
    <p class="tiny faint" style="margin-top:8px">The returned sale stays in your reports (fees, shipping and refund). The item cost is counted again only when it sells.</p>`,
    `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { const r=num($('#rt-r',ov).value), x=num($('#rt-s',ov).value); if (r<0||x<0) return toast('Amounts can’t be negative'); if (r>num(s.price)+num(s.shipCharged)+0.001) return toast('Refund is more than the sale');
    if ($('#rt-b',ov).checked){ it.past.push({...s, refund:round2(r), other:round2(num(s.other)+x), returned:true}); it.sale=null; it.delist=[]; it.tracking=''; it.status=it.where.length?'Listed':'To list'; it.refresh=todayKey(); }
    else { s.refund=round2(num(s.refund)+r); s.other=round2(num(s.other)+x); }
    save(); closeModal(); render(); toast($('#rt-b',ov)?.checked===false?'Refund saved':'Back in stock'); };
};

S.calc = {cost:'', sell:'', ship:'', pid:''};
SUBV.calc = () => { const c=S.calc; if(!c.pid) c.pid=DB.platforms.find(p=>p.on!==false)?.id||''; return `<h1>Buy or pass?</h1><p class="muted">Standing in the store? Check what a find would really earn after fees and shipping.</p>
  <div class="cols" style="margin-top:14px"><div class="card">
   <div class="grid g2 big-in"><div><label class="f">Price in store</label><input type="number" inputmode="decimal" id="bc-c" min="0" step="0.01" value="${esc(c.cost)}" placeholder="0.00"></div><div><label class="f">You could sell it for</label><input type="number" inputmode="decimal" id="bc-s" min="0" step="0.01" value="${esc(c.sell)}" placeholder="0.00"></div></div>
   <div class="sec"><label class="f">Where you would sell it</label>${pchips([c.pid],'bc-p')}</div>
   <div class="grid g2 sec"><div><label class="f">Shipping you would pay</label><input type="number" inputmode="decimal" id="bc-sh" min="0" step="0.01" value="${esc(c.ship)}" placeholder="0.00"></div><div><label class="f">Profit you want, at least</label><input type="number" inputmode="decimal" id="bc-t" min="0" step="1" value="${num(DB.settings.target)}"></div></div></div>
   <div class="stack"><div class="card" id="bc-r"></div></div></div>`; };
function calcDraw(){
  const el=$('#bc-r'); if(!el) return; const c=S.calc, x=buyCalc(c.cost, c.sell, c.pid, c.ship, DB.settings.target);
  const V={buy:['Buy it','Good profit'],think:['Think twice','Small profit'],pass:['Pass','You would lose money'],'':['—','Enter the prices']}[x.verdict];
  el.innerHTML = `<div class="verdict ${x.verdict}" style="margin-top:0"><div class="vv">${V[0]}</div><div class="vn">${num(c.sell)>0?money(x.net):''}</div><div class="small">${V[1]}${num(c.sell)>0?' · profit after fees':''}</div></div>
   <div class="calcbox">${[['Fees',money(x.fees)],['ROI',pct(x.roi,0)],['Margin',pct(x.margin,0)]].map(([l,v])=>`<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
   <div class="note" style="margin-top:12px">Pay no more than <b>${num(c.sell)>0?money(Math.max(0,x.max)):'—'}</b> to keep at least ${money(DB.settings.target)} profit.</div>
   <div class="row" style="margin-top:12px"><button class="btn pri" data-act="calcAdd" ${num(c.sell)>0?'':'disabled'}>${ic('plus')} I bought it — add to inventory</button><button class="btn ghost" data-act="calcClear">Clear</button></div>`;
}
ACT.calcOpen = () => go('more','calc');
ACT.calcClear = () => { S.calc={cost:'', sell:'', ship:'', pid:S.calc.pid}; render(); };

  <div class="row" style="margin-top:14px"><button class="btn pri sm" data-act="lotEdit">${ic('plus')} Add a lot</button></div>

  return `<div class="between"><div><h1>Sales</h1><p class="muted">Every sale with its true profit — after cost, fees and shipping.</p></div><button class="btn pri" data-act="salePick">${ic('plus')} Record sale</button></div>

   <div class="grid g4" style="margin-top:12px">

    <div class="tile"><div class="l">Revenue</div><div class="v">${money(t.revenue)}</div><div class="s">avg ${money(t.avgSale)} a sale</div></div>

function samplePhoto(cat, seed){
  const pal=[['#E9DCC9','#C9B69B'],['#DCE3EC','#A9B7CB'],['#E7D6D6','#C59B9B'],['#DDE6DA','#A8BBA2'],['#EADFC3','#CDB57E'],['#E2DCEA','#B3A6C6']][seed%6];
  const c=document.createElement('canvas'); c.width=320; c.height=320; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,320,320); gr.addColorStop(0,pal[0]); gr.addColorStop(1,pal[1]); g.fillStyle=gr; g.fillRect(0,0,320,320);
  g.fillStyle='rgba(255,255,255,.82)'; g.strokeStyle='rgba(60,50,40,.35)'; g.lineWidth=5; g.lineJoin='round';
  const P=(pts)=>{ g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); g.fill(); g.stroke(); };
  if (cat==='Clothing') P([[110,70],[140,60],[160,80],[180,60],[210,70],[255,120],[228,145],[212,130],[212,260],[108,260],[108,130],[92,145],[65,120]]);
  else if (cat==='Shoes') P([[60,220],[70,150],[120,150],[150,185],[245,200],[262,235],[60,235]]);
  else if (cat==='Bags & accessories'){ P([[80,140],[240,140],[255,260],[65,260]]); g.beginPath(); g.arc(160,140,52,Math.PI,0); g.stroke(); }
  else if (cat==='Home & decor') P([[130,70],[190,70],[180,110],[215,170],[200,255],[120,255],[105,170],[140,110]]);
  else if (cat==='Toys & games'){ P([[70,110],[250,110],[250,240],[70,240]]); g.beginPath(); g.arc(160,175,30,0,7); g.stroke(); }
  else if (cat==='Electronics'){ P([[60,90],[260,90],[260,220],[60,220]]); P([[130,220],[190,220],[205,250],[115,250]]); }
  else if (cat==='Books & media'){ P([[90,70],[220,70],[220,260],[90,260]]); g.beginPath(); g.moveTo(110,70); g.lineTo(110,260); g.stroke(); }
  else { g.beginPath(); g.arc(160,165,80,0,7); g.fill(); g.stroke(); }
  return c.toDataURL('image/jpeg',.8);
}

  const n=L.length, sold=L.filter(x=>x[5].length).length; let si=0, ui=0;
  for (let i=0;i<n;i++){
    const [name,cat,source,cost,price,sales]=L[i];
    const isS = sales.length>0, sIdx = isS ? si++ : 0;
    /* spread sales over the last ~8 months, newest first */
    const saleAgo = isS ? Math.max(0, Math.round(sIdx*(232/sold)) + Math.floor(rnd()*3)) : 0;
    const days = isS ? 4+Math.floor(rnd()*40) : 0;
    const listedAgo = isS ? saleAgo+days : [3,8,15,22,30,41,52,66,80,95,26,12,34,71,5][ui++%15];
    const boughtAgo = listedAgo + 1 + Math.floor(rnd()*6);
    const inLot = cost===0;
    const it = fixItem({id:uid()+i, sku:nextSku(), name, cat, source:inLot?'Estate sale':source, cost, price, bought:D(inLot?118:boughtAgo), bin:'ABCDE'[i%5]+(1+i%6), lot:inLot?lot.id:'', listed:D(inLot?110:listedAgo)});
    if (isS){
      const [pn, sp, ship] = sales[0]; const p=pid(pn), shipCost=ship;
      it.where = sales.map(x=>pid(x[0])); if (i%4===0 && pn!=='eBay') it.where.push(pid('eBay')); if (i%5===1 && pn!=='Mercari') it.where.push(pid('Mercari'));
      it.price = price;
      const sc = ['eBay','Etsy','Depop'].includes(pn) ? ship : 0;
      it.sale = {date:D(saleAgo), platform:p, price:sp, shipCharged:sc, fees:feeFor(p, sp, sc), shipCost:['Facebook Marketplace','Local / cash'].includes(pn)?0:(pn==='Poshmark'||pn==='Mercari'||pn==='Vinted'?0:shipCost), other:i===8?4:0, refund:0};
      it.status = saleAgo<=2 && i%3!==2 ? 'Sold' : 'Shipped';
      if (it.status==='Sold') it.delist = it.where.filter(w=>w!==p);
    } else {
      it.status = ui%5===2 ? 'To list' : 'Listed';
      if (it.status==='Listed'){ it.where=[pid(['eBay','Poshmark','Mercari','Etsy','Depop'][i%5])]; if (i%3===0) it.where.push(pid('Mercari')===it.where[0]?pid('eBay'):pid('Mercari')); } else { it.listed=''; }
    }
    if (i<30 || !isS) { const ph='s'+uid()+i; try { await phPut(ph, samplePhoto(cat, i)); it.photo=ph; } catch(e){} }
    DB.items.push(it);
  }
  /* one return that came back and was relisted */
  const ret = DB.items.find(x=>x.name==='Vintage sweatshirt'); ret.past=[{date:D(40), platform:pid('eBay'), price:45, shipCharged:7, fees:feeFor(pid('eBay'),45,7), shipCost:7, other:6.5, refund:52, returned:true}]; ret.refresh=D(30); ret.status='Listed'; ret.where=[pid('eBay')]; ret.listed=ret.listed||D(70);
  splitLot(lot,'price');
  const ex = [['Shipping supplies','Poly mailers (100)',16.99],['Shipping supplies','Bubble mailers & tape',24.5],['Software & apps','Cross-listing app',29.99],['Packaging','Tissue paper & thank-you cards',12],['Promoted listings & ads','Promoted listings',18.4],['Photography','Photo light box',34],['Storage','Clear storage bins (6)',42],['Office supplies','Thermal labels (500)',19.99],['Sourcing fees','Estate sale entry',5]];
  for (let m=0;m<8;m++) ex.forEach(([cat,text,amt],j)=>{ if ((m+j)%4===0 || (j===2)) DB.expenses.push({id:uid()+m+'e'+j, date:D(m*30+j*3+2), cat, text, amount:round2(amt*(j===2?1:(0.85+rnd()*.3)))}); });
  const tr = [['Thrift store sourcing run','Home','Thrift store',6.2],['Post office drop-off','Home','Post office',2.1],['Estate sale','Home','Estate sale',12.4],['Garage sale route','Home','Neighborhood',8.5]];
  for (let k=0;k<26;k++){ const [p,f,to,mi]=tr[k%4]; DB.trips.push({id:uid()+'t'+k, date:D(k*9+1), purpose:p, from:f, to, miles:mi, round:true}); }
}

/* ---------- welcome ---------- */
function welcome(){
  const ov = modal('Welcome <span style="color:var(--accent)">✦</span>', `
    <p class="muted" style="margin-top:12px">Know what you really make from every sale — after cost, fees and shipping. For eBay, Poshmark, Mercari, Depop, Vinted and anywhere else you sell.</p>
    <div class="sec"><label class="f">Your name <span class="faint">(optional)</span></label><input type="text" id="w-name" placeholder="Sarah" value="${esc(DB.settings.name)}"></div>
    <div class="sec"><label class="f">Currency</label><select id="w-cur">${CURRENCIES.map(([k,l])=>`<option value="${k}" ${DB.settings.currency===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="private small" style="margin-top:16px">${ic('lock')} No account, no cloud, no subscription. Everything stays on this device.</div>`,
    `<button class="btn" data-demo>${ic('sparkle')} Explore with sample data</button><button class="btn pri" data-start>Start tracking</button>`, {sticky:true});
  $('.x', ov).style.display='none';
  const done = async demo => { DB.settings.name=$('#w-name',ov).value.trim(); DB.settings.currency=$('#w-cur',ov).value; DB.settings.setup=true;
    if (demo){ await makeDemo(); DB.settings.demo=true; }
    save(); closeModal(); render(); toast(demo?'Sample data loaded — clear it any time in Settings':'Check your platform fees in More › Platforms & fees'); };
  $('[data-start]',ov).onclick = () => done(false); $('[data-demo]',ov).onclick = () => done(true);
}

/* ---------- init ---------- */
load();
$('#logo').innerHTML = LOGO;
render();
if (!DB.settings.setup) welcome();
window.addEventListener('afterprint', ()=>{ $('#print').innerHTML=''; });
let rzT, lastW = innerWidth; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if ((innerWidth<760)!==(lastW<760) && !$('#ov')) render(); lastW=innerWidth; },200); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
